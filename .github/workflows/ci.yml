name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: backend · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: webapp/requirements*.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r webapp/requirements.txt -r webapp/requirements-capture.txt
      - name: Tests
        working-directory: webapp/backend
        run: python -m pytest -q
      - name: CLI smoke test
        run: |
          python journal.py --help
          python journal.py doctor || true
          python journal.py schedule status
          python -c "import collect, daily, weekly, analyze, dashboard, feishu, osutil; print(osutil.SYSTEM, osutil.config_dir())"

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/frontend/package-lock.json
      - working-directory: webapp/frontend
        run: |
          npm ci
          npm run build
